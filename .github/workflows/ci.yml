name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha has no Signed-off-by line."
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo "Add sign-offs with: git rebase --signoff $base"
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Verify assurance properties
        run: npm test

      # Every example must validate against the schema it claims to follow.
      # Publishing schemas that the reference case does not satisfy would be a
      # worse failure than publishing no schemas.
      - name: Examples validate against the published schemas
        run: npx tsx ./cli/validate.ts

      # The reference assessment is generated from the engine. If regenerating
      # produces a diff, the published example no longer matches the code that
      # claims to produce it — which is the specific way a reference assessment
      # stops being trustworthy.
      - name: Reference assessment is up to date
        run: |
          npm run build:examples
          if ! git diff --exit-code --stat; then
            echo "::error::examples/ and threat-library/ are stale. Run 'npm run build:examples' and commit the result."
            exit 1
          fi

  # The action is a product surface, so it is run rather than merely published.
  # It assesses a case produced by `decirance init`, which also proves that what
  # the quick start creates is something the action can read.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Create a case for it to assess
        run: npx tsx ./cli/decirance.ts init ./ci-case
      - name: The action assesses it
        id: decirance
        uses: ./
        with:
          case: ./ci-case
          require: approve_with_conditions
      - name: And reports what it found
        run: |
          echo "recommendation: ${{ steps.decirance.outputs.recommendation }}"
          echo "bound by:       ${{ steps.decirance.outputs.binding-rule }}"
          test "${{ steps.decirance.outputs.recommendation }}" = 'approve_with_conditions'
